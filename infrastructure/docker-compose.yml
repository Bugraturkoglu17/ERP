version: "3.8"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: golabs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-golabs_erp}
      POSTGRES_USER: ${POSTGRES_USER:-golabs_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golabs_admin} -d ${POSTGRES_DB:-golabs_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (Celery Broker & Cache) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: golabs-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── pgAdmin (DB GUI) ───────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: golabs-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@golabs.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change_me_pgadmin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - dev-tools

  # ─── FastAPI Backend ────────────────────────────────────────────
  api:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: golabs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-golabs_admin}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-golabs_erp}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_me_secret_key_min_32_chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALGORITHM: HS256
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-golabs-documents}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_REGION: ${OCI_REGION:-eu-frankfurt-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ENV: ${ENV:-development}
      AUTO_MIGRATE: "true"
      AUTO_MIGRATE_WAIT_SECONDS: "90"
      AUTO_BOOTSTRAP_PLATFORM_ADMIN: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../apps/backend:/app:cached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Celery Worker ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: golabs-celery
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-golabs_admin}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-golabs_erp}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_me_secret_key_min_32_chars}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-golabs-documents}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ENV: ${ENV:-development}
      AUTO_MIGRATE: "false"
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_WORKERS:-4}
    volumes:
      - ../apps/backend:/app:cached
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination celery@$$HOSTNAME | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Celery Beat (Scheduled Tasks) ─────────────────────────────
  celery-beat:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: golabs-celery-beat
    restart: unless-stopped
    depends_on:
      - redis
      - celery-worker
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-golabs_admin}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-golabs_erp}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_me_secret_key_min_32_chars}
      ENV: ${ENV:-development}
      AUTO_MIGRATE: "false"
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ../apps/backend:/app:cached
    healthcheck:
      disable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
