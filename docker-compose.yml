version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sismik-erp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sismik_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sismik-network

  redis:
    image: redis:7-alpine
    container_name: sismik-erp-redis
    restart: always
    networks:
      - sismik-network

  backend:
    build: 
      context: ./apps/backend
    container_name: sismik-erp-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sismik_erp}
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - AUTO_MIGRATE=false
      - AUTO_MIGRATE_WAIT_SECONDS=90
      - AUTO_BOOTSTRAP_PLATFORM_ADMIN=false
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM_DEFAULT=${EMAIL_FROM_DEFAULT:-info@golabstek.com}
      - EMAIL_FROM_NAME_DEFAULT=${EMAIL_FROM_NAME_DEFAULT:-GOLABS ERP}
      - EMAIL_REPLY_TO_DEFAULT=${EMAIL_REPLY_TO_DEFAULT:-info@golabstek.com}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - sismik-network

  worker:
    build:
      context: ./apps/backend
    container_name: sismik-erp-worker
    restart: always
    command: celery -A app.core.workers.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sismik_erp}
      - REDIS_URL=redis://redis:6379/0
      - AUTO_MIGRATE=false
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM_DEFAULT=${EMAIL_FROM_DEFAULT:-info@golabstek.com}
      - EMAIL_FROM_NAME_DEFAULT=${EMAIL_FROM_NAME_DEFAULT:-GOLABS ERP}
      - EMAIL_REPLY_TO_DEFAULT=${EMAIL_REPLY_TO_DEFAULT:-info@golabstek.com}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION}
    depends_on:
      - db
      - redis
    networks:
      - sismik-network

networks:
  sismik-network:
    driver: bridge

volumes:
  postgres_data:
