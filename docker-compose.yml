version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: golabs-erp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-golabs_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - golabs-network

  redis:
    image: redis:7-alpine
    container_name: golabs-erp-redis
    restart: always
    networks:
      - golabs-network

  backend:
    build: 
      context: ./apps/backend
    container_name: golabs-erp-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-golabs_erp}
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - AUTO_MIGRATE=false
      - AUTO_MIGRATE_WAIT_SECONDS=90
      - AUTO_BOOTSTRAP_PLATFORM_ADMIN=false
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM_DEFAULT=${EMAIL_FROM_DEFAULT:-info@golabstek.com}
      - EMAIL_FROM_NAME_DEFAULT=${EMAIL_FROM_NAME_DEFAULT:-GOLABS ERP}
      - EMAIL_REPLY_TO_DEFAULT=${EMAIL_REPLY_TO_DEFAULT:-info@golabstek.com}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - golabs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./apps/backend
    container_name: golabs-erp-worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-golabs_erp}
      - REDIS_URL=redis://redis:6379/0
      - AUTO_MIGRATE=false
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM_DEFAULT=${EMAIL_FROM_DEFAULT:-info@golabstek.com}
      - EMAIL_FROM_NAME_DEFAULT=${EMAIL_FROM_NAME_DEFAULT:-GOLABS ERP}
      - EMAIL_REPLY_TO_DEFAULT=${EMAIL_REPLY_TO_DEFAULT:-info@golabstek.com}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION}
    depends_on:
      - db
      - redis
    networks:
      - golabs-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination celery@$$HOSTNAME | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: ./apps/backend
    container_name: golabs-erp-beat
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-golabs_erp}
      - REDIS_URL=redis://redis:6379/0
      - AUTO_MIGRATE=false
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM_DEFAULT=${EMAIL_FROM_DEFAULT:-info@golabstek.com}
      - EMAIL_FROM_NAME_DEFAULT=${EMAIL_FROM_NAME_DEFAULT:-GOLABS ERP}
      - EMAIL_REPLY_TO_DEFAULT=${EMAIL_REPLY_TO_DEFAULT:-info@golabstek.com}
    depends_on:
      - db
      - redis
    networks:
      - golabs-network

networks:
  golabs-network:
    driver: bridge

volumes:
  postgres_data:
